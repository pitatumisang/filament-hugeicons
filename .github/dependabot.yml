# Adapted from filamentphp/plugin-skeleton 5.x at 8c10f2a15e366101ec7893b92b971b01fba52b44.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
